
<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="sky" src="Assets/Lab10RiverSummer.jpg">
        <img id="waffle" src="Assets/Waffle texture.jpg">
        <img id="icecream" src="Assets/IceCreamTexture.jpg">
        <img id="pink" src="Assets/PinkIcecreamTexture.jpg">
        <img id="ball" src="Assets/BeachBallTexture.png">
      </a-assets>
      // Strawberry Ice Cream and Cone
      <a-cone src="#waffle" position="-3 0.5 -5" rotation="180 0 0"></a-cone>
      <a-sphere src="#pink" position="-3 1.5 -5" radius="0.9"></a-sphere>

      // Vanilla Ice Cream and Cone
      <a-cone src="#waffle" position="0 0.5 -5" rotation="180 0 0"></a-cone>
      <a-sphere src="#icecream" position="0 1.5 -5" radius="0.9"></a-sphere>

      // Chocolate Ice Cream and Cone
      <a-cone src="#waffle" position="3 0.5 -5" rotation="180 0 0"></a-cone>
      <a-sphere color="#8B4513" position="3 1.5 -5" radius="0.9"></a-sphere>
     // Beach Ball
      <a-sphere src="#ball" position="1 0.7 -3" radius="0.7"></a-sphere>
      <a-sky src="#sky"></a-sky>

    </a-scene>
  </body>
</html>
