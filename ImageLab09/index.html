<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Snowman body -->
      <a-sphere position="0 0.65 -4" radius="0.65" color="white"></a-sphere>
      <a-sphere position="0 1.65 -4" radius="0.5" color="white"></a-sphere>
      <a-sphere position="0 2.45 -4" radius="0.4" color="white"></a-sphere>
      <!-- Eyes -->
      <a-sphere position="-0.15 2.55 -4.36" radius="0.06" color="black"></a-sphere>
      <a-sphere position="0.15 2.55 -4.36" radius="0.06" color="black"></a-sphere>
      <!-- Buttons -->
      <a-sphere position="0 1.85 -4.49" radius="0.07" color="black"></a-sphere>
      <a-sphere position="0 1.6 -4.5" radius="0.07" color="black"></a-sphere>
      <a-sphere position="0 1.35 -4.46" radius="0.07" color="black"></a-sphere>
      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="white"></a-plane>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: japan; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
